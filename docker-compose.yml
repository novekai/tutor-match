name: tutor-match

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutor_match
      POSTGRES_USER: tutor_match
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tutor_match}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_match -d tutor_match"]
      interval: 5s
      retries: 10

  app:
    build: ./docker/php
    image: tutor-match-php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
    environment:
      SERVER_NAME: ":80"
      SERVER_ROOT: /app/backend/public
    # Pas de port publié : le Caddy du VPS (réseau partagé) fait le HTTPS
    # et relaie vers tutor-match-app:80. Voir deploy/Caddyfile.snippet.
    networks:
      default:
      proxy:
        aliases:
          - tutor-match-app

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-n8n-ajdj_default}

volumes:
  db-data:
